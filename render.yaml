# ==========================================
# RENDER DEPLOYMENT CONFIGURATION
# ==========================================
# This file configures fullstack (frontend, backend, and database) on Render
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: gene-forge-db
    plan: free
    region: oregon

services:
  # Backend Service - Flask API
  - type: web
    name: gene-forge-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --workers=1 --bind=0.0.0.0:$PORT --timeout=120"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: gene-forge-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://gene-forge-analyzer.vercel.app
      - key: ALLOWED_ORIGINS
        value: https://gene-forge-analyzer.vercel.app,https://gene-forge-analyzer-shankar.vercel.app
      - key: JWT_COOKIE_SECURE
        value: True
      - key: JWT_COOKIE_SAMESITE
        value: None
      - key: NODE_ENV
        value: production
      - key: FLASK_ENV
        value: production
      - key: ADMIN_EMAIL
        placeholder: "admin@geneforge.com"
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: EMAIL_USERNAME
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
    rootDir: apps/backend

  # Frontend Service - Static Site
  - type: web
    name: gene-forge-frontend
    env: static
    rootDir: apps/frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://gene-forge-backend.onrender.com
      - key: VITE_APP_NAME
        value: Gene Forge Analyzer
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
