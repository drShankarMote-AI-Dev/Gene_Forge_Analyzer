name: Frontend CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'apps/frontend/**'
      - 'package*.json'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'apps/frontend/**'
      - 'package*.json'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build frontend
      run: npm run build --workspace=apps/frontend
      env:
        VITE_API_URL: https://gene-forge-analyzer.onrender.com/api
        VITE_APP_NAME: "Gene Forge Analyzer"

    - name: Lint
      run: npm run lint --workspace=apps/frontend
      continue-on-error: true

    - name: Build Docker Image
      run: |
        docker build -t gene-forge-frontend:latest ./apps/frontend
