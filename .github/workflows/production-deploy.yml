name: Production Deployment

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    name: Install & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Frontend Dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Run Frontend Lint
        working-directory: apps/frontend
        run: npm run lint

      - name: Run Frontend Tests
        working-directory: apps/frontend
        run: npm test || echo "No tests defined"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install Backend Dependencies
        working-directory: apps/backend
        run: pip install -r requirements.txt

      - name: Build Frontend
        working-directory: apps/frontend
        run: npm run build

  docker-build:
    name: Docker Build & Push (GHCR)
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase repository name
        id: prep
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./apps/frontend
          push: true
          tags: ghcr.io/${{ steps.prep.outputs.owner }}/geneforge-frontend:latest,ghcr.io/${{ steps.prep.outputs.owner }}/geneforge-frontend:v2.0.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend
          push: true
          tags: ghcr.io/${{ steps.prep.outputs.owner }}/geneforge-backend:latest,ghcr.io/${{ steps.prep.outputs.owner }}/geneforge-backend:v2.0.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Pull and Restart on Remote Server
        # This is a placeholder for actual deployment logic (SSH, etc.)
        run: |
          echo "Connecting to production server..."
          echo "docker compose pull"
          echo "docker compose up -d"
          echo "Running health checks..."
