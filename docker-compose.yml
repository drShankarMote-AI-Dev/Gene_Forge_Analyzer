version: '3.9'

services:
  # Backend Service - Flask API
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: geneforge-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///geneforge.db}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-jwt-dev-secret}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@geneforge.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - NODE_ENV=${NODE_ENV:-development}
      - FLASK_ENV=${FLASK_ENV:-development}
    ports:
      - "5000:5000"
    volumes:
      - ./apps/backend:/app
      - backend-data:/app/instance
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    networks:
      - geneforge-network

  # Frontend Service - React/Vite with Nginx
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: geneforge-frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:5000/api
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/" ]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    networks:
      - geneforge-network

volumes:
  backend-data:
    driver: local

networks:
  geneforge-network:
    driver: bridge
